name: Build docs

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: 'master'
          submodules: 'recursive'
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.17.2
      - name: Build docs
        run: cd docs && zola build
